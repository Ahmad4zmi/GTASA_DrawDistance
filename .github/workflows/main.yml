name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: false

      - name: Build with ndk-build
        run: |
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            NDK_OUT=obj \
            NDK_LIBS_OUT=libs \
            -j"$(nproc)"

      - name: List output
        run: find libs -name '*.so' -exec ls -l {} +

      - name: Package per-ABI
        run: |
          mkdir -p dist
          for abi in libs/*/; do
            name=$(basename "$abi")
            zip -j "dist/GTASA_DrawDistance-${name}.zip" "$abi"*.so
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTASA_DrawDistance
          path: |
            libs/**/*.so
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
