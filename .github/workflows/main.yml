name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: false

      # ABI (arm64-v8a) is set in Application.mk
      - name: Build with ndk-build
        run: |
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_PLATFORM=android-21 \
            NDK_OUT=obj \
            NDK_LIBS_OUT=libs \
            -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/GTASA_DrawDistance-arm64-v8a.zip libs/arm64-v8a/*.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTASA_DrawDistance-arm64-v8a
          path: libs/arm64-v8a/*.so
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
